<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1b12"/>
      <stop offset="100%" stop-color="#140c08"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86d3b"/>
      <stop offset="40%" stop-color="#7c4b23"/>
      <stop offset="100%" stop-color="#4e2d13"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b93829"/>
      <stop offset="100%" stop-color="#8f2418"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#236a56"/>
      <stop offset="100%" stop-color="#17493b"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b547e"/>
      <stop offset="100%" stop-color="#1c3957"/>
    </linearGradient>
    <linearGradient id="book4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b35"/>
      <stop offset="100%" stop-color="#a6741e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Inner Frame -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="#8a5a32" stroke-width="6" opacity="0.4"/>
  
  <!-- Book 1 (Red) -->
  <g transform="translate(88, 118)">
    <rect x="0" y="0" width="66" height="242" rx="8" fill="url(#book1)"/>
    <rect x="10" y="24" width="46" height="8" rx="3" fill="#f5d08a" opacity="0.85"/>
    <rect x="10" y="206" width="46" height="8" rx="3" fill="#f5d08a" opacity="0.85"/>
    <rect x="18" y="64" width="30" height="100" rx="4" fill="#f5d08a" opacity="0.25"/>
  </g>

  <!-- Book 2 (Green, taller) -->
  <g transform="translate(164, 96)">
    <rect x="0" y="0" width="74" height="264" rx="8" fill="url(#book2)"/>
    <rect x="12" y="26" width="50" height="10" rx="4" fill="#e8c882" opacity="0.85"/>
    <circle cx="37" cy="132" r="18" fill="#e8c882" opacity="0.35"/>
    <rect x="12" y="224" width="50" height="10" rx="4" fill="#e8c882" opacity="0.85"/>
  </g>

  <!-- Book 3 (Blue) -->
  <g transform="translate(248, 128)">
    <rect x="0" y="0" width="64" height="232" rx="8" fill="url(#book3)"/>
    <rect x="10" y="20" width="44" height="6" rx="3" fill="#e2e8f0" opacity="0.7"/>
    <rect x="10" y="34" width="44" height="6" rx="3" fill="#e2e8f0" opacity="0.7"/>
    <rect x="10" y="198" width="44" height="8" rx="3" fill="#e2e8f0" opacity="0.7"/>
  </g>

  <!-- Book 4 (Tilted Gold/Amber) -->
  <g transform="translate(324, 118) rotate(11 34 242)">
    <rect x="0" y="0" width="68" height="242" rx="8" fill="url(#book4)"/>
    <rect x="12" y="24" width="44" height="10" rx="3" fill="#fff7e6" opacity="0.85"/>
    <rect x="20" y="68" width="28" height="106" rx="4" fill="#4a2c09" opacity="0.25"/>
    <rect x="12" y="206" width="44" height="10" rx="3" fill="#fff7e6" opacity="0.85"/>
  </g>

  <!-- Wooden Shelf Plank -->
  <rect x="52" y="360" width="408" height="38" rx="10" fill="url(#shelf)"/>
  <rect x="52" y="360" width="408" height="8" rx="4" fill="#c98e58" opacity="0.5"/>
  <!-- Shelf brackets -->
  <path d="M84 398 L112 398 L84 428 Z" fill="#4e2d13"/>
  <path d="M428 398 L400 398 L428 428 Z" fill="#4e2d13"/>
</svg>
